name: Relatar problema
description: Informe um comportamento inesperado sem incluir dados sensíveis.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar a Acta. Remova nomes, e-mails, tokens, cookies e screenshots com dados reais.
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - Editor
        - Gravação
        - Execução
        - Planilhas
        - Relatórios
        - Instalação
        - Segurança
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Use dados fictícios e descreva a sequência mínima.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Confirmei que o relato não contém credenciais nem dados pessoais reais.
          required: true
